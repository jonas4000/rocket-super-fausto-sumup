[platformio]
default_envs = esp32s3

; Waveshare ESP32-S3-Touch-LCD-2.8 (16 MB flash, 8 MB octal PSRAM).
; pioarduino fork = Arduino-ESP32 core 3.x; the official platform is stuck on 2.x.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = +<firmware/> +<ui/>
lib_deps = ${lvgl.lib_deps}
; LVGL allocates with malloc instead of its fixed pool, so large blocks
; (layers, image transforms) can go to PSRAM; ST7789 = LVGL's display driver.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ${lvgl.build_flags}
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_USE_ST7789=1
monitor_speed = 115200

; Terminal simulator on the host: fake reader + fake motor + simulated clock.
[env:sim]
platform = native
build_src_filter = +<sim/>
build_flags = -std=c++17

; Real SumUp Cloud API calls from the Mac (same SumUpPayment as the firmware,
; libcurl transport). Needs include/secrets.h.
[env:sumup-cli]
platform = native
build_src_filter = +<sumup-cli/>
build_flags = -std=c++17 -lcurl -Isrc/host

; LVGL is configured here instead of an lv_conf.h.
[lvgl]
lib_deps = lvgl/lvgl@9.2.2
build_flags =
    -DLV_CONF_SKIP
    -DLV_MEM_SIZE=262144U
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1
    -Isrc/ui
; C++17 for C++ files only (LVGL's C sources share build_flags).
extra_scripts = pre:tools/cxx17.py

; Desktop display simulator: real Ui + Controller in an SDL2 window.
; Needs `brew install sdl2`. With --sumup it uses the real SumUp reader
; (keys from include/secrets.h, libcurl).
[env:ui-sim]
platform = native
build_src_filter = +<ui/> +<ui-sim/>
lib_deps = ${lvgl.lib_deps}
build_flags =
    ${lvgl.build_flags}
    -DLV_USE_SDL=1
    -lcurl -Isrc/host
    !echo "-I$(brew --prefix)/include -L$(brew --prefix)/lib -lSDL2"
extra_scripts = ${lvgl.extra_scripts}

; Headless UI snapshots (BMP files) driven by scripted taps; no window.
[env:ui-snap]
platform = native
build_src_filter = +<ui/> +<ui-snap/>
lib_deps = ${lvgl.lib_deps}
build_flags = ${lvgl.build_flags}
extra_scripts = ${lvgl.extra_scripts}

; Host-side unit tests for lib/core.
[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
